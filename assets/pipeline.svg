<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 90" width="760" height="90">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#5a3420"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="90" rx="10" fill="#0c0a09"/>
  <rect width="760" height="90" rx="10" fill="none" stroke="#2a1508" stroke-width="1"/>

  <!-- Arrows (drawn first, behind nodes) -->
  <!-- 1→2  gap 120..144 -->
  <line x1="121" y1="45" x2="136" y2="45" stroke="#5a3420" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- 2→3  gap 244..268 -->
  <line x1="245" y1="45" x2="260" y2="45" stroke="#5a3420" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- 3→4  gap 368..392 -->
  <line x1="369" y1="45" x2="384" y2="45" stroke="#d4520a" stroke-width="1.5" marker-end="url(#arr)">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </line>
  <!-- 4→5  gap 492..516 -->
  <line x1="493" y1="45" x2="508" y2="45" stroke="#5a3420" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- 5→6  gap 616..640 -->
  <line x1="617" y1="45" x2="632" y2="45" stroke="#5a3420" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Node 1: Brief  x=20..120 -->
  <rect x="20" y="23" width="100" height="44" rx="7" fill="#181410" stroke="#3a2415"/>
  <text x="70" y="42" text-anchor="middle" font-family="monospace" font-size="13" fill="#d4520a" font-weight="bold">①</text>
  <text x="70" y="58" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,sans-serif" font-size="12" fill="#b0a090">Brief</text>

  <!-- Node 2: Research  x=144..244 -->
  <rect x="144" y="23" width="100" height="44" rx="7" fill="#181410" stroke="#3a2415"/>
  <text x="194" y="42" text-anchor="middle" font-family="monospace" font-size="13" fill="#d4520a" font-weight="bold">②</text>
  <text x="194" y="58" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,sans-serif" font-size="12" fill="#b0a090">Research</text>

  <!-- Node 3: Design ×6  x=268..368  HIGHLIGHTED -->
  <rect x="268" y="18" width="100" height="54" rx="7" fill="#1e0e06" stroke="#d4520a" stroke-width="1.5"/>
  <text x="318" y="42" text-anchor="middle" font-family="monospace" font-size="13" fill="#d4520a" font-weight="bold">③</text>
  <text x="318" y="58" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,sans-serif" font-size="12" fill="#e8ddd0">Design ×6</text>

  <!-- Node 4: Critique  x=392..492 -->
  <rect x="392" y="23" width="100" height="44" rx="7" fill="#181410" stroke="#3a2415"/>
  <text x="442" y="42" text-anchor="middle" font-family="monospace" font-size="13" fill="#d4520a" font-weight="bold">④</text>
  <text x="442" y="58" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,sans-serif" font-size="12" fill="#b0a090">Critique</text>

  <!-- Node 5: Gallery  x=516..616 -->
  <rect x="516" y="23" width="100" height="44" rx="7" fill="#181410" stroke="#3a2415"/>
  <text x="566" y="42" text-anchor="middle" font-family="monospace" font-size="13" fill="#d4520a" font-weight="bold">⑤</text>
  <text x="566" y="58" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,sans-serif" font-size="12" fill="#b0a090">Gallery</text>

  <!-- Node 6: Apply  x=640..740 -->
  <rect x="640" y="23" width="100" height="44" rx="7" fill="#181410" stroke="#3a2415"/>
  <text x="690" y="42" text-anchor="middle" font-family="monospace" font-size="13" fill="#d4520a" font-weight="bold">⑥</text>
  <text x="690" y="58" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,sans-serif" font-size="12" fill="#b0a090">Apply</text>
</svg>
