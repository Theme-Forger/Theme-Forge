<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200">
  <defs>
    <radialGradient id="heat" cx="50%" cy="85%" r="65%">
      <stop offset="0%" stop-color="#2a1205"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="760" height="200" rx="14" fill="#0c0a09"/>
  <rect width="760" height="200" rx="14" fill="url(#heat)"/>
  <rect width="760" height="200" rx="14" fill="none" stroke="#2a1508" stroke-width="1.5"/>

  <!-- Ambient forge glow beneath FORGE -->
  <ellipse cx="380" cy="158" rx="270" ry="22" fill="#d4520a">
    <animate attributeName="opacity" values="0.04;0.11;0.04" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- THEME wordmark -->
  <text x="380" y="92"
    text-anchor="middle"
    font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif"
    font-size="72"
    font-weight="bold"
    fill="#e8ddd0"
    letter-spacing="20"
  >THEME</text>

  <!-- FORGE wordmark in forge orange -->
  <text x="380" y="155"
    text-anchor="middle"
    font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif"
    font-size="72"
    font-weight="bold"
    fill="#d4520a"
    letter-spacing="20"
  >FORGE</text>

  <!-- Animated accent line below FORGE -->
  <line x1="110" y1="167" x2="650" y2="167" stroke="#d4520a" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.12;0.42;0.12" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Subtitle -->
  <text x="380" y="187"
    text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="12.5"
    fill="#6a5848"
    letter-spacing="3.5"
  >DESIGNER-IN-A-BOX FOR CLAUDE CODE</text>

  <!-- Spark 1  x=205  left drift -->
  <circle cx="205" cy="161" r="2.8" fill="#ff9922">
    <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.08;1" dur="2.8s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="cy" from="161" to="76" dur="2.8s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="cx" from="205" to="198" dur="2.8s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="r" from="2.8" to="0.4" dur="2.8s" begin="0s" repeatCount="indefinite"/>
  </circle>

  <!-- Spark 2  x=268  right drift -->
  <circle cx="268" cy="161" r="2.0" fill="#ffcc44">
    <animate attributeName="opacity" values="0;0.8;0" keyTimes="0;0.08;1" dur="3.4s" begin="0.7s" repeatCount="indefinite"/>
    <animate attributeName="cy" from="161" to="73" dur="3.4s" begin="0.7s" repeatCount="indefinite"/>
    <animate attributeName="cx" from="268" to="275" dur="3.4s" begin="0.7s" repeatCount="indefinite"/>
    <animate attributeName="r" from="2.0" to="0.3" dur="3.4s" begin="0.7s" repeatCount="indefinite"/>
  </circle>

  <!-- Spark 3  x=330  left drift  largest -->
  <circle cx="330" cy="161" r="3.2" fill="#ff7700">
    <animate attributeName="opacity" values="0;1.0;0" keyTimes="0;0.07;1" dur="2.5s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="cy" from="161" to="81" dur="2.5s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="cx" from="330" to="323" dur="2.5s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="r" from="3.2" to="0.5" dur="2.5s" begin="1.3s" repeatCount="indefinite"/>
  </circle>

  <!-- Spark 4  x=393  center  slow -->
  <circle cx="393" cy="161" r="2.2" fill="#ffaa22">
    <animate attributeName="opacity" values="0;0.75;0" keyTimes="0;0.08;1" dur="3.7s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="cy" from="161" to="71" dur="3.7s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="cx" from="393" to="386" dur="3.7s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="r" from="2.2" to="0.2" dur="3.7s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Spark 5  x=455  right drift -->
  <circle cx="455" cy="161" r="2.8" fill="#ff8800">
    <animate attributeName="opacity" values="0;0.85;0" keyTimes="0;0.08;1" dur="2.9s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" from="161" to="79" dur="2.9s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="cx" from="455" to="462" dur="2.9s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="r" from="2.8" to="0.4" dur="2.9s" begin="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Spark 6  x=520  left drift  small -->
  <circle cx="520" cy="161" r="1.8" fill="#ffcc00">
    <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.09;1" dur="3.2s" begin="1.0s" repeatCount="indefinite"/>
    <animate attributeName="cy" from="161" to="76" dur="3.2s" begin="1.0s" repeatCount="indefinite"/>
    <animate attributeName="cx" from="520" to="514" dur="3.2s" begin="1.0s" repeatCount="indefinite"/>
    <animate attributeName="r" from="1.8" to="0.1" dur="3.2s" begin="1.0s" repeatCount="indefinite"/>
  </circle>

  <!-- Spark 7  x=576  right drift  delayed -->
  <circle cx="576" cy="161" r="2.4" fill="#ff6600">
    <animate attributeName="opacity" values="0;0.8;0" keyTimes="0;0.08;1" dur="3.0s" begin="2.2s" repeatCount="indefinite"/>
    <animate attributeName="cy" from="161" to="73" dur="3.0s" begin="2.2s" repeatCount="indefinite"/>
    <animate attributeName="cx" from="576" to="583" dur="3.0s" begin="2.2s" repeatCount="indefinite"/>
    <animate attributeName="r" from="2.4" to="0.3" dur="3.0s" begin="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>
